<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haari_Codes Notifications</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #FFF9F4;
    color: #493B50;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 7%;
    background: #FFF9F4;
    border-bottom: 1px solid #F0E5EB;
    gap: 12px;
}

.logo {
    color: #7952A0;
    font-size: 22px;
    font-weight: bold;
}

.back-btn {
    text-decoration: none;
    color: #7952A0;
    background: #F5E8F3;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
}

.notification-count {
    background: #D96B91;
    color: white;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 20px;
    margin-left: 5px;
}

main {
    max-width: 650px;
    margin: 35px auto;
    padding: 20px;
}

h1 {
    color: #7952A0;
    margin-bottom: 8px;
    font-size: 25px;
}

.subtitle {
    color: #987E9E;
    font-size: 13px;
    margin-bottom: 22px;
}

.notification-panel {
    background: #FFF9F4;
    border: 1px solid #EADCEB;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(73,59,80,0.08);
    overflow: hidden;
}

.notification-header {
    padding: 16px;
    background: #F5E8F3;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.notification-header h3 {
    font-size: 16px;
    color: #7952A0;
}

.notification-header button,
.notification-footer button {
    border: none;
    background: none;
    color: #7952A0;
    font-size: 12px;
    cursor: pointer;
}

.notification-item {
    padding: 17px;
    border-bottom: 1px solid #F0E5EB;
    cursor: pointer;
}

.notification-item.unread {
    background: #FCEEF2;
}

.notification-item strong {
    font-size: 14px;
    color: #7952A0;
}

.notification-item p {
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
}

.notification-item small {
    display: block;
    font-size: 11px;
    color: #987E9E;
    margin-top: 8px;
}

.notification-footer {
    padding: 15px;
    text-align: center;
}

.empty-notification {
    padding: 30px 12px;
    text-align: center;
    font-size: 14px;
    color: #7952A0;
}

@media(max-width: 400px) {
    header {
        padding: 15px;
    }

    .logo {
        font-size: 19px;
    }

    main {
        margin-top: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Haari_Codes</div>

    <a href="index.html" class="back-btn">
        ← Back to Home
    </a>
</header>

<main>
    <h1>Notifications 🔔</h1>
    <p class="subtitle">Stay updated with Haari_Codes.</p>

    <div class="notification-panel">

        <div class="notification-header">
            <h3>All Notifications</h3>
            <button id="clearNotifications">Clear All</button>
        </div>

        <div id="notificationList"></div>

        <div class="notification-footer">
            <button id="markRead">Mark all as read</button>
        </div>

    </div>
</main>

<script>

let notifications = JSON.parse(
    localStorage.getItem("haariNotifications")
) || [
    {
        id: 1,
        title: "Welcome to Haari_Codes!",
        message: "Start your learning journey with us.",
        time: "New",
        read: false
    },
    {
        id: 2,
        title: "Keep Learning!",
        message: "Explore lessons and practise your coding skills.",
        time: "New",
        read: false
    }
];

const list = document.getElementById("notificationList");

function saveNotifications() {
    localStorage.setItem(
        "haariNotifications",
        JSON.stringify(notifications)
    );
}

function renderNotifications() {

    list.innerHTML = "";

    if (notifications.length === 0) {
        list.innerHTML = `
            <div class="empty-notification">
                You're all caught up! 💜
            </div>
        `;
        return;
    }

    notifications.forEach(n => {

        const item = document.createElement("div");

        item.className = "notification-item" +
            (n.read ? "" : " unread");

        const title = document.createElement("strong");
        title.textContent = n.title;

        const message = document.createElement("p");
        message.textContent = n.message;

        const time = document.createElement("small");
        time.textContent = n.time;

        item.append(title, message, time);

        item.addEventListener("click", () => {
            n.read = true;
            saveNotifications();
            renderNotifications();
        });

        list.appendChild(item);
    });
}

document.getElementById("markRead")
.addEventListener("click", () => {

    notifications.forEach(n => {
        n.read = true;
    });

    saveNotifications();
    renderNotifications();
});

document.getElementById("clearNotifications")
.addEventListener("click", () => {

    notifications = [];

    saveNotifications();
    renderNotifications();
});

function addNotification(title, message) {

    notifications.unshift({
        id: Date.now(),
        title: title,
        message: message,
        time: new Date().toLocaleString(),
        read: false
    });

    saveNotifications();
    renderNotifications();
}

// SHOW NOTIFICATIONS IMMEDIATELY ON PAGE LOAD

saveNotifications();
renderNotifications();

</script>

</body>
</html>
