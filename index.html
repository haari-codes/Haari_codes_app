<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0f5">
    <title>Haari_Codes | Learn • Practice • Build</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">
        <button class="icon-button" onclick="openSection('Menu')">☰</button>

        <div class="brand">
            <h1>👑 Haari_Codes</h1>
            <p>Learn • Practice • Build ♡</p>
        </div>

        <button class="icon-button" onclick="openSection('Notifications')">♧</button>
    </header>

    <main>

        <!-- HAARI INTRODUCTION -->
        <section class="hero">

            <div class="haari-image">
                <img src="haari.png" alt="Haari AI Companion">
            </div>

            <div class="speech-bubble">
                <p>Hey there! 👋</p>
                <h2>I'm Haari!</h2>
                <p>Your AI learning companion. Let's learn something new today! ♡</p>
            </div>

        </section>

        <!-- SEARCH -->
        <section class="search-section">
            <div class="search-box">
                <span>⌕</span>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search courses, topics or tools..."
                >
                <button onclick="searchContent()">⚙</button>
            </div>
        </section>

        <!-- MAIN FEATURES -->
        
<section class="feature-grid">

    <button class="feature-card" onclick="openSection('Learn')">
        <span class="feature-icon">
            <svg viewBox="0 0 64 64">
                <path d="M5 15 Q20 7 32 17 Q44 7 59 15 V49 Q44 41 32 51 Q20 41 5 49Z"/>
                <path d="M32 17 V51 M12 22 Q21 19 27 25 M12 31 Q21 28 27 34 M37 25 Q46 19 54 22 M37 34 Q46 28 54 31"/>
            </svg>
        </span>
        <span><strong>Learn</strong><small>Explore concepts</small></span>
        <b>›</b>
    </button>

    <button class="feature-card" onclick="openSection('DSA Visualizer')">
        <span class="feature-icon">
            <svg viewBox="0 0 64 64">
                <rect x="25" y="5" width="14" height="12" rx="2"/>
                <path d="M32 17 V28 M12 28 H52 M12 28 V43 M32 28 V43 M52 28 V43"/>
                <rect x="5" y="43" width="14" height="13" rx="2"/>
                <rect x="25" y="43" width="14" height="13" rx="2"/>
                <rect x="45" y="43" width="14" height="13" rx="2"/>
            </svg>
        </span>
        <span><strong>DSA Visualizer</strong><small>See it in action</small></span>
        <b>›</b>
    </button>

    <button class="feature-card" onclick="openSection('Practice')">
        <span class="feature-icon">
            <svg viewBox="0 0 64 64">
                <rect x="12" y="10" width="40" height="49" rx="5"/>
                <rect x="23" y="5" width="18" height="10" rx="3"/>
                <path d="M20 27 L24 31 L30 23 M35 28 H45 M20 41 L24 45 L30 37 M35 42 H45"/>
            </svg>
        </span>
        <span><strong>Practice</strong><small>Test your skills</small></span>
        <b>›</b>
    </button>

    <button class="feature-card" onclick="openSection('Haari AI')">
        <span class="feature-icon">
            <svg viewBox="0 0 64 64">
                <path d="M32 7 V14 M28 7 H36"/>
                <rect x="10" y="17" width="44" height="34" rx="10"/>
                <circle cx="23" cy="32" r="4"/>
                <circle cx="41" cy="32" r="4"/>
                <path d="M23 42 Q32 49 41 42 M5 27 V41 M59 27 V41 M20 54 H44"/>
            </svg>
        </span>
        <span><strong>Haari AI</strong><small>Ask anything</small></span>
        <b>›</b>
    </button>

</section>


        <!-- CONTINUE LEARNING -->
        <section class="continue-section">

            <div class="section-heading">
                <h2>Continue Learning</h2>
                <button onclick="openSection('All Courses')">
                    View All →
                </button>
            </div>

            <div class="course-card">

                <div class="course-thumbnail">
                    &lt;/&gt;
                </div>

                <div class="course-info">
                    <h3>C Programming</h3>
                    <p>Variables & Data Types</p>

                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                </div>

                <div class="course-progress">
                    <button onclick="openSection('C Programming')">▶</button>
                    <span>60%</span>
                </div>

            </div>

        </section>

        <!-- QUOTE -->
        <section class="quote-banner">
            <p>“Dream it. Code it. Achieve it.” ♡</p>
            <span>— Haari_Codes</span>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="nav-item active" onclick="openSection('Home')">
            <span>⌂</span>
            <small>Home</small>
        </button>

        <button class="nav-item" onclick="openSection('Courses')">
            <span>▤</span>
            <small>Courses</small>
        </button>

        <button class="nav-item" onclick="openSection('Progress')">
            <span>▥</span>
            <small>Progress</small>
        </button>

        <button class="nav-item" onclick="openSection('Profile')">
            <span>♙</span>
            <small>Profile</small>
        </button>

    </nav>

    <script src="script.js"></script>

</body>
</html>
